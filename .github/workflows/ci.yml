name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Preserve required evidence for each main commit, including queued jobs.
# Cancel only superseded checks on the same PR; never a main push run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.12
        with:
          version: 'stable'
      - name: Install package
        run: raco pkg install --auto --link "$(pwd)"
      - name: Run tests
        run: raco test -p dbc
      - name: Run synthetic DBC codec quickstart
        run: racket examples/quickstart.rkt
      - name: Build Scribble reference and check package dependencies
        run: raco setup --check-pkg-deps -l dbc
